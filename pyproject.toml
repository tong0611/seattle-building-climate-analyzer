[build-system]
requires = ["setuptools>=77"]  # PEP 639 license fields
build-backend = "setuptools.build_meta"

[project]
name = "beps-prioritizer"
version = "0.1.0"
description = "Prioritize Seattle buildings for decarbonization under BEPS and WA CBPS."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.6",  # GroupKFold(shuffle=True)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
app = ["streamlit>=1.40", "altair>=5", "pydeck>=0.9"]

[project.scripts]
beps = "beps_prioritizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
